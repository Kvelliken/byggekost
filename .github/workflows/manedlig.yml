name: Månedlig kjøring

# Når jobben skal gå:
on:
  # Den 16. hver måned kl. 06:00 UTC = 08:00 norsk sommertid.
  # SSB publiserer rundt den 10.-14., så vi har god margin.
  # Tidspunktet er alltid UTC - GitHub bryr seg ikke om norsk tid.
  schedule:
    - cron: "0 6 16 * *"

  # Lar deg trykke "Run workflow" selv, når som helst.
  # IKKE fjern denne. GitHub slår av planlagte kjøringer hvis
  # repoet ligger helt urørt i 60 dager, og en manuell kjøring
  # teller som aktivitet.
  workflow_dispatch:

# Jobben må få lov til å skrive tilbake til repoet.
permissions:
  contents: write

jobs:
  kjor:
    runs-on: ubuntu-latest

    steps:
      - name: Hent koden
        uses: actions/checkout@v5

      - name: Sett opp Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer pakker
        run: pip install -r requirements.txt pytest

      # Stopper kjøringen hvis en endring i koden har ødelagt noe,
      # før det rekker å havne på nettsiden.
      - name: Kjør tester
        run: python -m pytest -q

      - name: Kjør modellen
        run: python modell.py

      - name: Lagre resultatet
        run: |
          # Planlagt kjøring uten nye tall fra SSB: ikke lagre noe, slik at
          # siden ikke får ny dato uten nytt innhold. En manuell kjøring
          # lagrer alltid, fordi den som regel skyldes en endring i koden.
          if [ "${{ github.event_name }}" = "schedule" ] && git diff --quiet -- data/indeks_siste.csv; then
            echo "Ingenting nytt - SSB har ikke publisert nye tall siden sist."
            exit 0
          fi
          git config user.name "byggekost-bot"
          git config user.email "actions@github.com"
          git add docs data
          if git diff --staged --quiet; then
            echo "Ingen endringer å lagre."
          else
            git commit -m "Oppdatert $(date +'%Y-%m-%d')"
            git push
          fi
